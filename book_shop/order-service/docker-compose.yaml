
services:
  postgres:
    image: postgres:15-alpine
    container_name: order_service_postgres
    environment:
      POSTGRES_DB: order_service_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_password
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=ru_RU.UTF-8"
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_user -d book_catalog_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - order_service_network
    restart: unless-stopped

  order-service:
    build: .
    container_name: order_service_app
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/order_service_db
      - SPRING_DATASOURCE_USERNAME=order_user
      - SPRING_DATASOURCE_PASSWORD=order_password
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: |
      sh -c "
        echo 'Ожидание PostgreSQL...' &&
        while ! nc -z postgres 5432; do
          sleep 2
          echo 'PostgreSQL еще не готов...'
        done &&
        echo 'PostgreSQL готов! Запускаем приложение...' &&
        exec java -jar app.jar
      "
    networks:
      - order_service_network
    restart: unless-stopped

networks:
  order_service_network:
    driver: bridge

volumes:
  postgres_data: