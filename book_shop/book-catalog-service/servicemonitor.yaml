apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bookshop-services
  namespace: default
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: bookshop-helm
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
  namespaceSelector:
    matchNames:
      - default