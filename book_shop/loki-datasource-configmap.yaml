apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-grafana-datasource
  namespace: default
  labels:
    grafana_datasource: "1"
    app.kubernetes.io/instance: loki
    app.kubernetes.io/name: grafana
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        url: http://loki:3100
        access: proxy
        isDefault: true
        jsonData:
          maxLines: 1000
