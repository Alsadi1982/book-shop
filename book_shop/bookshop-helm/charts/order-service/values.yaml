# Default values for order-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: alsadi1982/orderservice
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: v3

deployment:
  containerPort: 8082

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
# runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: NodePort
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8082
  targetPort: 8082

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /api/orders/$2
    nginx.ingress.kubernetes.io/use-regex: "true"
  hosts:
    - host: order.local
      paths:
        - path: /api/orders(/|$)(.*)
          pathType: ImplementationSpecific

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
    - name: gateway
      sectionName: http
      # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
    - chart-example.local
  # List of rules and filters applied.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
#   memory: 128Mi

# ============================================
# HEALTH PROBES - НАСТРОЙКИ ДЛЯ KUBERNETES
# ============================================
livenessProbe:
  enabled: true
  # Путь к health endpoint
  path: /api/orders/health
  # Начальная задержка (ждем запуска приложения и БД)
  initialDelaySeconds: 60
  # Интервал между проверками
  periodSeconds: 10
  # Количество неудачных проверок перед перезапуском пода
  failureThreshold: 3
  # Таймаут одного запроса
  timeoutSeconds: 5
  # Количество успешных проверок для отметки пода как живым
  successThreshold: 1

readinessProbe:
  enabled: true
  # Путь к health endpoint
  path: /api/orders/health
  # Начальная задержка (ждем инициализации)
  initialDelaySeconds: 30
  # Интервал между проверками
  periodSeconds: 5
  # Количество неудачных проверок перед исключением из сервиса
  failureThreshold: 3
  # Количество успешных проверок для включения в сервис
  successThreshold: 1
  # Таймаут одного запроса
  timeoutSeconds: 5

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 15-alpine
  service:
    port: 5432
    name: order-postgres
  auth:
    database: order_db
    username: order_user
    password: order_password

# ============================================
# ENVIRONMENT VARIABLES
# ============================================
env:
  # База данных
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:postgresql://localhost:5432/order_db"
  - name: SPRING_DATASOURCE_USERNAME
    value: "order_user"
  - name: SPRING_DATASOURCE_PASSWORD
    value: "order_password"
  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
    value: "update"
  - name: SERVER_PORT
    value: "8082"

  # Внешние сервисы
  - name: CATALOG_SERVICE_URL
    value: "http://bookshop-helm-book-catalog-service:8081"
  - name: USER_SERVICE_URL
    value: "http://bookshop-helm-user-service:8083"

  # Actuator и мониторинг
  - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
    value: "*"
  - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW-DETAILS
    value: "always"
  - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
    value: "true"
  - name: MANAGEMENT_HEALTH_CIRCUITBREAKERS_ENABLED
    value: "true"
  - name: MANAGEMENT_HEALTH_RATELIMITERS_ENABLED
    value: "true"

  # Resilience4j (опциональное переопределение)
  - name: RESILIENCE4J_CIRCUITBREAKER_INSTANCES_ORDERSERVICE_SLIDING-WINDOW-SIZE
    value: "20"
  - name: RESILIENCE4J_CIRCUITBREAKER_INSTANCES_ORDERSERVICE_FAILURE-RATE-THRESHOLD
    value: "50"
  - name: RESILIENCE4J_RATELIMITER_INSTANCES_ORDERSERVICE_LIMIT-FOR-PERIOD
    value: "5"

  - name: SPRING_CLOUD_COMPATIBILITY-VERIFIER_ENABLED
    value: "false"