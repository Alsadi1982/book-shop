apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "book-catalog-service.fullname" . }}-initdb
  labels:
    {{- include "book-catalog-service.labels" . | nindent 4 }}
data:
  init.sql: |
    -- Создание таблицы категорий
    CREATE TABLE IF NOT EXISTS categories (
        id BIGSERIAL PRIMARY KEY,
        code VARCHAR(50) UNIQUE NOT NULL,
        name VARCHAR(100) NOT NULL,
        description TEXT
        );

    -- Создание таблицы книг
    CREATE TABLE IF NOT EXISTS books (
        id BIGSERIAL PRIMARY KEY,
        isbn VARCHAR(20) UNIQUE NOT NULL,
        title VARCHAR(255) NOT NULL,
        author VARCHAR(255),
        description TEXT,
        price DECIMAL(10, 2),
        stock_quantity INTEGER DEFAULT 0,
        category_id BIGINT,
        publisher_id BIGINT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY (category_id) REFERENCES categories(id) ON DELETE SET NULL
        );

    INSERT INTO categories (code, name, description)
    VALUES ('FICTION', 'Художественная литература', 'Художественные произведения, романы, повести, рассказы'),
           ('TECHNICAL', 'Техническая литература', 'Книги по программированию, IT, инженерии и технологиям'),
           ('SCIENCE', 'Научная литература', 'Научно-популярные книги, физика, математика, биология'),
           ('BUSINESS', 'Бизнес-литература',
            'Книги по бизнесу, маркетингу, менеджменту и саморазвитию') ON CONFLICT (code) DO NOTHING;

