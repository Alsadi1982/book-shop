# Default values for book-catalog-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: alsadi1982/catalogservice
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: v3

deployment:
  containerPort: 8081
# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: NodePort
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8081
  targetPort: 8081

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
  hosts:
    - host: catalog.local
      paths:
        - path: /api/catalog(/|$)(.*)
          pathType: ImplementationSpecific
        - path: /actuator(/|$)(.*)
          pathType: ImplementationSpecific

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  enabled: true
  path: /actuator/health
  initialDelaySeconds: 60
  periodSeconds: 10
  # Количество неудачных проверок перед перезапуском пода
  failureThreshold: 3
  # Таймаут одного запроса
  timeoutSeconds: 5

readinessProbe:
  enabled: true
  path: /actuator/health
  initialDelaySeconds: 30
  periodSeconds: 5
  # Количество неудачных проверок перед исключением из сервиса
  failureThreshold: 3
  # Количество успешных проверок для включения в сервис
  successThreshold: 1
  # Таймаут одного запроса
  timeoutSeconds: 5

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 15-alpine
  service:
    port: 5432
    name: catalog-postgres
  auth:
    database: catalog_db
    username: catalog_user
    password: catalog_password

env:
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:postgresql://localhost:5432/catalog_db"
  - name: SPRING_DATASOURCE_USERNAME
    value: "catalog_user"
  - name: SPRING_DATASOURCE_PASSWORD
    value: "catalog_password"
  - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
    value: "org.postgresql.Driver"
  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
    value: "update"
  - name: SERVER_PORT
    value: "8081"

  # ============================================
  # ACTUATOR И МОНИТОРИНГ
  # ============================================
  - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
    value: "*"
  - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW-DETAILS
    value: "always"
  - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
    value: "true"
  - name: MANAGEMENT_HEALTH_CIRCUITBREAKERS_ENABLED
    value: "true"
  - name: MANAGEMENT_HEALTH_RATELIMITERS_ENABLED
    value: "true"

  # ============================================
  # RESILIENCE4J CIRCUIT BREAKER
  # ============================================
  - name: RESILIENCE4J_CIRCUITBREAKER_CONFIGS_DEFAULT_SLIDING-WINDOW-TYPE
    value: "count_based"
  - name: RESILIENCE4J_CIRCUITBREAKER_CONFIGS_DEFAULT_SLIDING-WINDOW-SIZE
    value: "10"
  - name: RESILIENCE4J_CIRCUITBREAKER_CONFIGS_DEFAULT_FAILURE-RATE-THRESHOLD
    value: "50"
  - name: RESILIENCE4J_CIRCUITBREAKER_CONFIGS_DEFAULT_WAIT-DURATION-IN-OPEN-STATE
    value: "10s"
  - name: RESILIENCE4J_CIRCUITBREAKER_CONFIGS_DEFAULT_PERMITTED-NUMBER-OF-CALLS-IN-HALF-OPEN-STATE
    value: "3"
  - name: RESILIENCE4J_CIRCUITBREAKER_CONFIGS_DEFAULT_MINIMUM-NUMBER-OF-CALLS
    value: "5"
  - name: RESILIENCE4J_CIRCUITBREAKER_CONFIGS_DEFAULT_SLOW-CALL-DURATION-THRESHOLD
    value: "2s"
  - name: RESILIENCE4J_CIRCUITBREAKER_CONFIGS_DEFAULT_SLOW-CALL-RATE-THRESHOLD
    value: "50"
  - name: RESILIENCE4J_CIRCUITBREAKER_CONFIGS_DEFAULT_AUTOMATIC-TRANSITION-FROM-OPEN-TO-HALF-OPEN-ENABLED
    value: "true"

  # Circuit Breaker для catalogService
  - name: RESILIENCE4J_CIRCUITBREAKER_INSTANCES_CATALOGSERVICE_SLIDING-WINDOW-SIZE
    value: "20"
  - name: RESILIENCE4J_CIRCUITBREAKER_INSTANCES_CATALOGSERVICE_FAILURE-RATE-THRESHOLD
    value: "60"
  - name: RESILIENCE4J_CIRCUITBREAKER_INSTANCES_CATALOGSERVICE_WAIT-DURATION-IN-OPEN-STATE
    value: "15s"
  - name: RESILIENCE4J_CIRCUITBREAKER_INSTANCES_CATALOGSERVICE_PERMITTED-NUMBER-OF-CALLS-IN-HALF-OPEN-STATE
    value: "5"

  # ============================================
  # RESILIENCE4J RATE LIMITER
  # ============================================
  - name: RESILIENCE4J_RATELIMITER_CONFIGS_DEFAULT_LIMIT-FOR-PERIOD
    value: "10"
  - name: RESILIENCE4J_RATELIMITER_CONFIGS_DEFAULT_LIMIT-REFRESH-PERIOD
    value: "1s"
  - name: RESILIENCE4J_RATELIMITER_CONFIGS_DEFAULT_TIMEOUT-DURATION
    value: "500ms"

  # Rate Limiter для catalogService
  - name: RESILIENCE4J_RATELIMITER_INSTANCES_CATALOGSERVICE_LIMIT-FOR-PERIOD
    value: "5"
  - name: RESILIENCE4J_RATELIMITER_INSTANCES_CATALOGSERVICE_LIMIT-REFRESH-PERIOD
    value: "1s"
  - name: RESILIENCE4J_RATELIMITER_INSTANCES_CATALOGSERVICE_TIMEOUT-DURATION
    value: "1s"

  # ============================================
  # RESILIENCE4J RETRY
  # ============================================
  - name: RESILIENCE4J_RETRY_CONFIGS_DEFAULT_MAX-ATTEMPTS
    value: "3"
  - name: RESILIENCE4J_RETRY_CONFIGS_DEFAULT_WAIT-DURATION
    value: "1s"
  - name: RESILIENCE4J_RETRY_CONFIGS_DEFAULT_EXPONENTIAL-BACKOFF-MULTIPLIER
    value: "2"
  - name: RESILIENCE4J_RETRY_CONFIGS_DEFAULT_MAX-WAIT-DURATION
    value: "5s"

  # Retry для catalogService
  - name: RESILIENCE4J_RETRY_INSTANCES_CATALOGSERVICE_MAX-ATTEMPTS
    value: "2"
  - name: RESILIENCE4J_RETRY_INSTANCES_CATALOGSERVICE_WAIT-DURATION
    value: "2s"

  # ============================================
  # RESILIENCE4J BULKHEAD
  # ============================================
  - name: RESILIENCE4J_BULKHEAD_CONFIGS_DEFAULT_MAX-CONCURRENT-CALLS
    value: "25"
  - name: RESILIENCE4J_BULKHEAD_CONFIGS_DEFAULT_MAX-WAIT-DURATION
    value: "10ms"

  # ============================================
  # RESILIENCE4J TIME LIMITER
  # ============================================
  - name: RESILIENCE4J_TIMELIMITER_CONFIGS_DEFAULT_TIMEOUT-DURATION
    value: "5s"
  - name: RESILIENCE4J_TIMELIMITER_CONFIGS_DEFAULT_CANCEL-RUNNING-FUTURE
    value: "true"

  # ============================================
  # LOGGING
  # ============================================
  - name: LOGGING_LEVEL_IO_GITHUB_RESILIENCE4J_CIRCUITBREAKER
    value: "DEBUG"
  - name: LOGGING_LEVEL_IO_GITHUB_RESILIENCE4J_RATELIMITER
    value: "DEBUG"

  - name: SPRING_CLOUD_COMPATIBILITY-VERIFIER_ENABLED
    value: "false"