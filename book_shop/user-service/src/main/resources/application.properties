spring.application.name=user-service
server.port=8083

spring.datasource.url=jdbc:postgresql://postgres:5433/user_service_db
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true

spring.cache.type=simple
spring.cache.cache-names=users,usersByEmail,usersByUsername

security.password.bcrypt-strength=10
security.password.min-length=6
security.password.require-digit=true
security.password.require-lowercase=true
security.password.require-uppercase=true
security.password.require-special=true

logging.level.com.otus.order_service=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.cache=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} - %msg%n

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
