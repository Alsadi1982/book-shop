spring.application.name=user-service
server.port=8083

spring.datasource.url=jdbc:postgresql://postgres:5433/user_service_db
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true

spring.cache.type=simple
spring.cache.cache-names=users,usersByEmail,usersByUsername

security.password.bcrypt-strength=10
security.password.min-length=6
security.password.require-digit=true
security.password.require-lowercase=true
security.password.require-uppercase=true
security.password.require-special=true

logging.config=classpath:logback-spring.xml
logging.level.root=INFO
logging.level.com.otus.order_service=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.cache=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.io.github.resilience4j.circuitbreaker=DEBUG
logging.level.io.github.resilience4j.ratelimiter=DEBUG

# Loki URL
loki.url=http://loki:3100/loki/api/v1/push

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true
management.health.db.enabled=true
# Prometheus metrics endpoint
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# ????????? ???? ??? ??????
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.instance=${HOSTNAME:localhost}

# ??????????? ??? HTTP ???????? (?????????? ??????????)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,500ms,1s,2s,5s

# ============================================
# RESILIENCE4J CIRCUIT BREAKER
# ============================================

# --- ?????????? ????????? ---
resilience4j.circuitbreaker.configs.default.sliding-window-type=count_based
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=50
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true

# --- ????????? ??? userService ---
# 30 ??????? ? ???? (???????????? ????? ?????????????)
resilience4j.circuitbreaker.instances.userService.sliding-window-size=30
# ????????? ??? 40% ?????? (???????????? ?????)
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=40
# ????? 10 ?????? ? ???????? ?????????
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=10s
# 3 ???????? ?????? ? HALF_OPEN
resilience4j.circuitbreaker.instances.userService.permitted-number-of-calls-in-half-open-state=3

# ============================================
# RESILIENCE4J RATE LIMITER
# ============================================

# --- ?????????? ????????? ---
resilience4j.ratelimiter.configs.default.limit-for-period=10
resilience4j.ratelimiter.configs.default.limit-refresh-period=1s
resilience4j.ratelimiter.configs.default.timeout-duration=500ms

# --- ????????? ??? userService ---
# 20 ???????? ? ??????? (???????????? ????????????? ?????)
resilience4j.ratelimiter.instances.userService.limit-for-period=20
# ?????? ??????????: 1 ???????
resilience4j.ratelimiter.instances.userService.limit-refresh-period=1s
# ??????? ????????: 500 ??
resilience4j.ratelimiter.instances.userService.timeout-duration=500ms

# --- ??????? ????? ??? ??????????? ---
# ???????????: 3 ??????? ? ??????? (?????? ?? ?????)
resilience4j.ratelimiter.instances.userService-register.limit-for-period=3
resilience4j.ratelimiter.instances.userService-register.limit-refresh-period=1s
resilience4j.ratelimiter.instances.userService-register.timeout-duration=0ms

# ?????: 5 ??????? ? ??????? (?????? ?? ?????????)
resilience4j.ratelimiter.instances.userService-login.limit-for-period=5
resilience4j.ratelimiter.instances.userService-login.limit-refresh-period=1s
resilience4j.ratelimiter.instances.userService-login.timeout-duration=0ms

# ============================================
# RESILIENCE4J RETRY
# ============================================

# --- ?????????? ????????? ---
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=1s
resilience4j.retry.configs.default.exponential-backoff-multiplier=2
resilience4j.retry.configs.default.max-wait-duration=5s
resilience4j.retry.configs.default.retry-exceptions=java.io.IOException,org.springframework.dao.DataAccessException

# --- ????????? ??? userService ---
# 2 ????????? ??????? (????????? ? ????????)
resilience4j.retry.instances.userService.max-attempts=2
# ?????: 1 ???????
resilience4j.retry.instances.userService.wait-duration=1s

# ============================================
# RESILIENCE4J BULKHEAD
# ============================================

# ???????? ???????????? ??????? (???????????? ????? ?????????????)
resilience4j.bulkhead.configs.default.max-concurrent-calls=20
resilience4j.bulkhead.configs.default.max-wait-duration=500ms

# --- ????????? ??? userService ---
resilience4j.bulkhead.instances.userService.max-concurrent-calls=15
resilience4j.bulkhead.instances.userService.max-wait-duration=500ms

# ============================================
# RESILIENCE4J TIME LIMITER
# ============================================

resilience4j.timelimiter.configs.default.timeout-duration=5s
resilience4j.timelimiter.configs.default.cancel-running-future=true

resilience4j.timelimiter.instances.userService.timeout-duration=5s

